services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - object_data:/data/objects
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/omnirag
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OBJECT_STORE_PATH=/data/objects
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma}
      - SPARSE_MODEL=${SPARSE_MODEL:-Qdrant/bm25}
      - HYBRID_RETRIEVAL_ENABLED=${HYBRID_RETRIEVAL_ENABLED:-true}
      - RETRIEVAL_CANDIDATE_LIMIT=${RETRIEVAL_CANDIDATE_LIMIT:-40}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-true}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-base}
      - RERANKER_CANDIDATE_LIMIT=${RERANKER_CANDIDATE_LIMIT:-20}
      - CHUNK_TOKENIZER=${CHUNK_TOKENIZER:-sentence-transformers/all-MiniLM-L6-v2}
  worker-ingest:
    build: ./backend
    command: ["arq", "app.workers.ingest.WorkerSettings"]
    volumes:
      - object_data:/data/objects
      - model_cache:/root/.cache
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/omnirag
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OBJECT_STORE_PATH=/data/objects
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embeddinggemma}
      - SPARSE_MODEL=${SPARSE_MODEL:-Qdrant/bm25}
      - CHUNK_TOKENIZER=${CHUNK_TOKENIZER:-sentence-transformers/all-MiniLM-L6-v2}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d omnirag"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=omnirag
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    profiles: ["container-ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  object_data:
  model_cache:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
