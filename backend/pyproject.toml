[project]
name = "backend"
version = "0.1.0"
description = "OmniRAG Backend"
readme = "README.md"
authors = [
    { name = "Vishnu Kumar", email = "visnhu9027872285@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
]



[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
explicit_package_bases = true
