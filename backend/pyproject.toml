[project]
name = "backend"
version = "0.1.0"
description = "OmniRAG Backend"
readme = "README.md"
authors = [
    { name = "Vishnu Kumar", email = "visnhu9027872285@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "httpx>=0.28",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "sqlglot>=27,<29",
    "pathspec>=1,<2",
    # 0.26.0 segfaults while walking larger Python trees with language-pack 0.13.
    # Keep the validated 0.25 ABI until the upstream combination is proven safe.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=0.10,<1",
    "arq>=0.26",
    "qdrant-client>=1.20",
    "boto3>=1.40",
    "langgraph>=1.0,<2",
    # 0.5.2 supports the Redis 5 client required by ARQ; 0.6+ requires Redis client 6.3+.
    "langgraph-checkpoint-redis>=0.5.2,<0.6",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
ingestion = [
    "fastembed>=0.9,<1",
    "docling>=2.50,<3",
]
eval = [
    # Ragas 0.4.3 still imports the legacy VertexAI module removed in 0.4.x.
    "langchain-community==0.3.31",
    "ragas>=0.4,<0.5",
]



[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "pytest-asyncio>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
